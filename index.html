<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Muhammad Umer Farooq — UI/UX Designer, Software Engineer, AI Enthusiast</title>
    <meta
      name="description"
      content="Portfolio of Muhammad Umer Farooq (Umer): I design digital experiences, build software, and explore AI."
    />
    <meta property="og:title" content="Muhammad Umer Farooq — Design · Engineering · AI" />
    <meta
      property="og:description"
      content="I design digital experiences, build software, and explore AI."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('umer-theme');
          var theme =
            stored === 'day' || stored === 'night'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'day'
                : 'night';
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
